name: Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      components:
        description: 'Space-separated names (e.g. "grid combo-box"), empty = all overlay modules'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      it-matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Compute cache key
        id: key
        run: |
          gitlinks=$(git ls-files -s flow-components web-components | sha256sum | cut -c1-16)
          inputs="${{ hashFiles('package.json', 'package-lock.json', 'flow-components-overlay/**', 'web-components/yarn.lock', 'web-components/patches/**', 'gradle/**', 'build.gradle.kts', 'settings.gradle.kts', '.github/workflows/validation.yml') }}"
          echo "value=${{ runner.os }}-workspace-install-${inputs}-${gitlinks}" >> "$GITHUB_OUTPUT"

      - name: Restore install cache (skip work if hit)
        id: cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ steps.key.outputs.value }}
          path: |
            ~/.m2/repository/com/vaadin
            node_modules
            web-components/node_modules
            web-components/.yarn
            flow-components/**/node_modules
            flow-components/vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated

      - name: Workspace install
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew install --no-daemon

      - name: Save install cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.key.outputs.value }}
          path: |
            ~/.m2/repository/com/vaadin
            node_modules
            web-components/node_modules
            web-components/.yarn
            flow-components/**/node_modules
            flow-components/vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated

      - name: Compute IT matrix
        id: matrix
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          names=$(COMPONENTS="$COMPONENTS" bash scripts/overlay-component-names.sh)
          echo "Overlay names: $names"
          matrix=$(echo "$names" | bash scripts/compute-it-matrix.sh)
          echo "$matrix" | jq .
          {
            echo 'value<<EOF'
            echo "$matrix"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  flow-components-unit:
    name: Flow Components Unit Tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
          setup-java: 'true'
          sync-overlays: 'true'

      - name: Run unit tests
        run: |
          cd flow-components && mvn test -Drelease -T 4 \
            -Dsurefire.parallel=classes -Dsurefire.threadCount=2 \
            -B -ntp

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: flow-components/**/target/surefire-reports/TEST-*.xml
          retention-days: 1
          if-no-files-found: ignore

  flow-components-wtr:
    name: Flow Components WTR Tests
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
          setup-java: 'true'
          sync-overlays: 'true'

      - uses: ./.github/actions/install-tb-license
        with:
          tb-license: ${{ secrets.TB_LICENSE }}

      - name: Run WTR tests
        env:
          COMPONENTS: ${{ inputs.components }}
        run: cd flow-components && node scripts/wtr.js $COMPONENTS

      - name: Upload WTR reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wtr-reports
          path: flow-components/**/wtr-results.xml
          retention-days: 1
          if-no-files-found: ignore

  flow-components-its:
    name: Flow Components IT ${{ matrix.shard }}
    needs: [install]
    if: needs.install.outputs.it-matrix != '' && fromJson(needs.install.outputs.it-matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.install.outputs.it-matrix) }}
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}
          setup-java: 'true'
          sync-overlays: 'true'

      - uses: ./.github/actions/install-tb-license
        with:
          tb-license: ${{ secrets.TB_LICENSE }}

      - name: Compute artifact shard id
        id: shardid
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          value="${SHARD//\//-}"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Run IT shard
        env:
          SHARD_MODULES: ${{ matrix.modules }}
        run: |
          cd flow-components && mvn verify -am \
            -pl "$SHARD_MODULES" \
            -Drun-it \
            -Dvaadin.productionMode -Dvaadin.force.production.build=true \
            -Dfailsafe.forkCount=4 \
            -Dcom.vaadin.testbench.Parameters.testsInParallel=2 \
            -Dfailsafe.rerunFailingTestsCount=2 \
            -Dmaven.test.redirectTestOutputToFile=true \
            -Dtest.reuseDriver=true \
            -DskipUnitTests \
            -B -ntp

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: failsafe-reports-${{ steps.shardid.outputs.value }}
          path: flow-components/**/target/failsafe-reports/TEST-*.xml
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload error screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshots-${{ steps.shardid.outputs.value }}
          path: flow-components/**/error-screenshots/
          retention-days: 5
          if-no-files-found: ignore

  web-components-verify:
    name: Web Components Verify
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}

      - name: Lint
        working-directory: web-components
        run: npm run lint

      - name: Snapshot tests
        working-directory: web-components
        env:
          COMPONENTS: ${{ inputs.components }}
        run: bash ../scripts/run-wtr-config.sh web-test-runner-snapshots.config.js

      - name: Integration tests
        working-directory: web-components
        env:
          COMPONENTS: ${{ inputs.components }}
        run: bash ../scripts/run-wtr-config.sh web-test-runner-it.config.js

  web-components-unit:
    name: Web Components Unit (${{ matrix.browser }})
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            config: ''
          - browser: firefox
            config: 'web-test-runner-firefox.config.js'
            playwright: firefox
          - browser: webkit
            config: 'web-test-runner-webkit.config.js'
            playwright: webkit
    steps:
      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}

      - name: Cache Playwright browsers
        if: matrix.playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.playwright }}-${{ hashFiles('web-components/yarn.lock') }}

      - name: Install Playwright browser
        if: matrix.playwright
        working-directory: web-components
        run: npx playwright install ${{ matrix.playwright }} --with-deps

      - name: Run unit tests
        working-directory: web-components
        env:
          COMPONENTS: ${{ inputs.components }}
        run: bash ../scripts/run-wtr-config.sh "${{ matrix.config }}"

  web-components-visual:
    name: Web Components Visual
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.repository_owner == 'vaadin'
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Install zstd
        run: apt-get update && apt-get install -y zstd

      - uses: ./.github/actions/setup-workspace
        with:
          cache-key: ${{ needs.install.outputs.cache-key }}

      - name: Fix git safe directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Visual tests — base
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          retry_wait_seconds: 60
          max_attempts: 3
          command: cd web-components && bash ../scripts/run-wtr-config.sh web-test-runner-base.config.js
        env:
          COMPONENTS: ${{ inputs.components }}

      - name: Visual tests — Lumo
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          retry_wait_seconds: 60
          max_attempts: 3
          command: cd web-components && bash ../scripts/run-wtr-config.sh web-test-runner-lumo.config.js
        env:
          COMPONENTS: ${{ inputs.components }}

      - name: Visual tests — Aura
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          retry_wait_seconds: 60
          max_attempts: 3
          command: cd web-components && bash ../scripts/run-wtr-config.sh web-test-runner-aura.config.js
        env:
          COMPONENTS: ${{ inputs.components }}

      - name: Upload failed screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-components-visual-screenshots
          path: |
            web-components/packages/*/test/visual/base/screenshots/*/failed/*.png
            web-components/packages/*/test/visual/lumo/screenshots/*/failed/*.png
            web-components/packages/*/test/visual/aura/screenshots/dark/*/failed/*.png
            web-components/packages/*/test/visual/aura/screenshots/default/*/failed/*.png
            web-components/packages/vaadin-lumo-styles/test/visual/screenshots/failed/*.png
          retention-days: 5
          if-no-files-found: ignore

  results:
    name: Collect results
    needs: [install, flow-components-unit, flow-components-wtr, flow-components-its, web-components-verify, web-components-unit, web-components-visual]
    if: always() && needs.install.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: surefire-reports
          path: surefire-reports

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: wtr-reports
          path: wtr-reports

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: failsafe-reports-*
          merge-multiple: true
          path: failsafe-reports

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: error-screenshots-*
          merge-multiple: true
          path: error-screenshots

      - name: Prune passing reports on red builds
        run: |
          has_failures=false
          for dir in surefire-reports wtr-reports failsafe-reports; do
            [ -d "$dir" ] || continue
            if find "$dir" -name '*.xml' | xargs grep -lE 'failures="[1-9]|errors="[1-9]' 2>/dev/null | grep -q .; then
              has_failures=true
              break
            fi
          done
          echo "has_failures=$has_failures" >> "$GITHUB_ENV"
          if [ "$has_failures" = "true" ]; then
            for dir in surefire-reports wtr-reports failsafe-reports; do
              [ -d "$dir" ] || continue
              find "$dir" -name '*.xml' | while read -r f; do
                grep -qE 'failures="[1-9]|errors="[1-9]' "$f" || rm -f "$f"
              done
            done
          fi

      - name: Publish Unit Test results
        id: unit-dorny
        if: hashFiles('surefire-reports/**/TEST-*.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Flow Components Unit Tests
          path: surefire-reports/**/TEST-*.xml
          reporter: java-junit
          list-tests: ${{ env.has_failures == 'true' && 'failed' || 'all' }}
          fail-on-error: 'false'

      - name: Publish WTR results
        id: wtr-dorny
        if: hashFiles('wtr-reports/**/wtr-results.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Flow Components WTR Tests
          path: wtr-reports/**/wtr-results.xml
          reporter: java-junit
          list-tests: ${{ env.has_failures == 'true' && 'failed' || 'all' }}
          fail-on-error: 'false'

      - name: Publish IT results
        id: it-dorny
        if: hashFiles('failsafe-reports/**/TEST-*.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Flow Components Integration Tests
          path: failsafe-reports/**/TEST-*.xml
          reporter: java-junit
          list-tests: ${{ env.has_failures == 'true' && 'failed' || 'all' }}
          fail-on-error: 'false'

      - name: Upload merged error screenshots
        if: needs.flow-components-its.result != 'success'
        uses: actions/upload-artifact@v6
        with:
          name: error-screenshots
          path: error-screenshots/
          retention-days: 5
          if-no-files-found: ignore

      - name: Delete intermediate artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(
              (.name | startswith("error-screenshots-")) or
              (.name | startswith("failsafe-reports-"))
            ) | "\(.id) \(.name)"' \
          | while read -r id name; do
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
            done

      - name: Fail if any test failed
        if: always()
        run: |
          failed=false
          [[ "${{ steps.unit-dorny.outputs.conclusion }}" == "failure" ]] && failed=true
          [[ "${{ steps.wtr-dorny.outputs.conclusion }}"  == "failure" ]] && failed=true
          [[ "${{ steps.it-dorny.outputs.conclusion }}"   == "failure" ]] && failed=true
          [[ "${{ needs.web-components-verify.result }}" == "failure" ]] && failed=true
          [[ "${{ needs.web-components-unit.result }}"   == "failure" ]] && failed=true
          [[ "${{ needs.web-components-visual.result }}" == "failure" ]] && failed=true
          [[ "$failed" == "true" ]] && exit 1 || exit 0
