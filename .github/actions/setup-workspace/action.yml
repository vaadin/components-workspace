name: Setup workspace
description: Common workspace prelude — Node/Java setup, install cache restore, optional overlay sync. Must run AFTER actions/checkout (composite actions can't host the checkout step themselves because their definition file has to be present in the working tree before GHA can resolve them).

inputs:
  cache-key:
    description: Install cache key; pass needs.install.outputs.cache-key from the caller.
    required: true
  setup-java:
    description: Set to 'true' to set up JDK 21 with Maven cache (for jobs that run Maven).
    required: false
    default: 'false'
  sync-overlays:
    description: Set to 'true' to run scripts/sync-flow-overlays.sh after cache restore.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.setup-java == 'true'
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - uses: actions/setup-node@v6
      with:
        node-version: '24'

    - uses: actions/cache/restore@v5
      with:
        key: ${{ inputs.cache-key }}
        path: |
          ~/.m2/repository/com/vaadin
          node_modules
          web-components/node_modules
          web-components/.yarn
          flow-components/**/node_modules
          flow-components/vaadin-charts-flow-parent/vaadin-charts-flow-svg-generator/src/main/resources/META-INF/frontend/generated
        fail-on-cache-miss: true

    # Re-create the web-components/node_modules/.bin symlink. The Gradle finalizer
    # also creates it (so `./gradlew install` is self-contained for local dev), but
    # the GHA cache appears not to preserve the relative symlink reliably across
    # the save/restore round-trip — this step is the defensive ensure-step.
    - shell: bash
      run: bash scripts/setup-web-components-bin.sh

    - if: inputs.sync-overlays == 'true'
      shell: bash
      run: bash scripts/sync-flow-overlays.sh
